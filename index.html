<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>pdf.com.in — Privacy-First PDF Toolkit</title>
  <meta name="description"
    content="Clean, privacy-first, client-side PDF utility toolkit. Merge, split, compress, protect, unlock, and edit PDFs 100% offline in your browser." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wdth,wght@25..151,1..1000&display=swap"
    rel="stylesheet">

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <script>
    (function () {
      try {
        var stored = localStorage.getItem('theme');
        var isDark = stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) { }
    })();
  </script>
</head>

<body
  class="bg-gray-50 text-gray-900 antialiased selection:bg-primary-light selection:text-primary dark:bg-gray-950 dark:text-gray-100">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
